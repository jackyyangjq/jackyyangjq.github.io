type = "research"
title = "研究"
description = "我研究数字技术和公共政策如何改变旅游与酒店市场，方法上结合因果推断、时间序列模型，以及把大语言模型当作文本测量工具。"
methods_title = "方法与工具"
methods_description = "每一类方法都附有公开代码，在模拟数据或公开数据上运行，不涉及保密的研究数据，可以直接核对实现是否正确。"
note = "† 通讯作者。在审论文不展示估计结果和原图，以尊重审稿流程；示意图只画研究设计，不代表结果。"

