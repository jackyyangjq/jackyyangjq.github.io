[[groups.items]]
title = "Disclosed digital strategy in tourism: The automation–augmentation paradox in experiential service firms"
status = "工作论文"
authorship = "**Yang, J.**, Hao, F.†, & Wang, K."
award = "会议版本获 CHME 2026 总最佳论文奖和酒店管理最佳论文奖"
summary = "旅游与酒店企业如何在披露中呈现“自动化”与“增强”两类技术战略，用必须引用原文证据的大模型标签来测量。"
methods = ["带原文证据的大模型分类", "按置信度转人工复核", "有界结果的面板模型"]

[[groups.items]]
title = "酒店业的数字化转型与绩效"
status = "博士论文 · 准备中"
summary = "两项研究，考察自助入住技术如何改变酒店运营和住客体验，使用大规模运营数据和在线评论。"
methods = ["多层方差分解", "带固定效应的分位数回归", "计数结果的分批实施 DID", "用大模型测量评论文本"]

