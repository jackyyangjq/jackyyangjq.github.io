type = "card"
title = "教学"
description = "教学方向：旅游与酒店经济学、酒店财务管理、服务业中的商业分析与人工智能、研究方法与计量经济学。"

[[items]]
title = "用 AI 辅助学习与研究"
subtitle = "客座研讨课 · 萨里商学院 Research Methods（MANM386）"
date = "2026 年 10 月"
content = "为旅游与酒店管理硕士生上的三场课，讲如何在课程作业和毕业论文研究中使用 AI，重点是让 AI 的输出可以核查。学生用结构化提示词研读一篇 Tourism Management 论文，用 AI 工具查找、阅读文献并获取写作反馈，学习核对参考文献和遵守萨里大学的 AI 使用规定，再让 AI 写 Python 代码、自己在 Google Colab 中运行和检查，做出一张期刊风格的图。最后介绍 Claude Code、Codex 等智能体工具。"
tags = ["研究生", "人工智能", "研究方法"]

[[items]]
title = "酒店、旅游与会展财务管理（HTM3222）"
subtitle = "助教 · 香港理工大学"
date = "2025 年春季学期"
content = "为酒店及旅游业管理荣誉学士课程的 82 名本科生带三个每周辅导小组，内容包括财务报表分析、债券和项目现金流。用一家酒店集团的年报设计电子表格练习，辅导三次个人作业和一个小组分析项目，评阅小组展示，每周设答疑时间。"
tags = ["本科", "公司财务", "辅导课"]

[[items]]
title = "AI 与数字营销"
subtitle = "受邀授课 · 萨里商学院 ODOS 数字夏令营"
date = "2026 年 5 月"
content = "为泰国“一区一奖学金”（ODOS）数字夏令营的学生上的半天互动课：AI 如何改变营销、品牌案例、虚拟网红、分组设计 AI 辅助广告方案的挑战，以及营销中的 AI 伦理。"
tags = ["工作坊", "人工智能", "营销"]

[[items]]
title = "智能入住：当科技遇上第一印象"
subtitle = "客座讲座 · 萨里商学院 Hospitality Information Systems（MANM565）"
date = "2026 年 4 月"
content = "面向酒店管理硕士生：酒店入住方式的演变、前台正在使用的技术，以及研究（包括我的博士研究）对其如何影响酒店运营和住客的发现。"
tags = ["研究生", "酒店科技"]

