date = "2026 年 4 月"
content = "面向酒店管理硕士生：酒店入住方式的演变、前台正在使用的技术，以及研究（包括我的博士研究）对其如何影响酒店运营和住客的发现。"
tags = ["研究生", "酒店科技"]

