extra_pages = ["visitors"]

[site]
title = "Jiaqi (Jacky) Yang"
description = "Jiaqi (Jacky) Yang is a dual PhD candidate at The Hong Kong Polytechnic University and the University of Surrey, working on causal inference, time series and large language models for tourism, hospitality and policy research."
favicon = "/favicon.svg"
last_updated = "28 September 2026"
url = "https://jackyyangjq.github.io"
og_image = "/images/og.jpg"
keywords = [
  "Jiaqi Yang",
  "Jacky Yang",
  "Tourism economics",
  "Hospitality technology",
  "Causal inference",
  "Difference-in-differences",
  "Large language models",
  "Text as data",
  "Time series",
]

[author]
name = "Jiaqi (Jacky) Yang"
title = "Dual PhD Candidate"
institution = "The Hong Kong Polytechnic University & University of Surrey"
affiliations = [
  "The Hong Kong Polytechnic University",
  "University of Surrey",
]
alternate_names = ["Jacky Yang", "杨嘉琦"]
avatar = "/images/avatar.jpg"

[[cv]]
label = "Academic CV"
href = "/files/Jiaqi_Yang_CV_Academic.pdf"
note = "Research and teaching"

[[cv]]
label = "Industry CV"
href = "/files/Jiaqi_Yang_CV_Industry.pdf"
note = "Data science, AI and quantitative research"

[social]
# Contact information (leave blank or delete to hide)
emails = [
  "jiaqi.yang@surrey.ac.uk",
  "jiaqi-jacky.yang@connect.polyu.hk",
]
github = "https://github.com/jackyyangjq"
linkedin = "https://www.linkedin.com/in/jiaqi-yang-7b8813326"

[features]
# Show a like button on the about page (stored only in the visitor's browser)
enable_likes = false

# Display all subpages on a single page
enable_one_page_mode = false

[analytics]
# The site's own cookie-free visit counter (source in analytics/)
endpoint = "https://jackyyangjq-visits.jackyyangjq.workers.dev"
map_data = "https://jackyyangjq-visits.jackyyangjq.workers.dev/stats.json"

[i18n]
enabled = true
locales = ["en", "zh"]
default_locale = "en"
# "fixed": everyone starts in English and can switch; the choice is remembered.
mode = "fixed"
fixed_locale = "en"
persist = true
switcher = true

[i18n.labels]
zh = "中文"
en = "English"

