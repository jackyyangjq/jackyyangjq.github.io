[[sections]]
id = "project-management"
nav = "Project management"
title = "Running a project with a team of AI sessions"
lead = "A paper outgrows a single chat, so I run it like a small team."
steps_style = "flow"
callout = "Some decisions never leave me: the research design, how the main results are defined, the hypotheses and the structure of the paper."

[[sections.steps]]
icon = "clipboard"
label = "Coordinator"
title = "Plan"
body = "Splits the work into task cards and sends me short briefings. It never does the tasks itself."

[[sections.steps]]
icon = "bot"
label = "Worker sessions"
title = "Do"
body = "Each card runs in its own session: the strongest model for judgement, a faster one for mechanical work."

[[sections.steps]]
icon = "shield"
label = "Fresh reviewer"
title = "Check"
body = "A new session checks the result against the card's acceptance criteria."

[[sections.steps]]
icon = "board"
label = "Task board"
title = "Record"
body = "One file holds every card's status, so progress survives across sessions and devices."

[[sections]]
id = "quiet-errors"
nav = "Quiet errors"
title = "Errors that don't announce themselves"
lead = "The costliest mistakes in my AI-assisted work showed no error message. Most produced a plausible number that was wrong. The usual fix: the session that wrote something is never the only one that checks it."
fix_label = "Now"

[[sections.folds]]
title = "An ID that overflowed"
fix = "Cast types before building keys, and re-check main results in a separate session."
body = "Two small-integer columns were multiplied to build a group ID. The product overflowed and quietly merged thousands of groups, moving the main estimate by about a fifth. A separate verification session caught it."

[[sections.folds]]
title = "A weight left out"
fix = "Headline estimates must agree with a second, independent implementation."
body = "One step of a weighted fixed-effects model ran without the weights. The estimate matched neither valid version of the model, yet it reached early figures before a re-estimate with explicit dummy variables exposed it."

[[sections.folds]]
title = "A gap in the wrong place"
fix = "Plot each variable's coverage over time before using it."
body = "Salary data were almost empty for the five quarters covering the AI shock and the year after it, so a before-and-after comparison was really comparing two years far apart."

[[sections.folds]]
title = "A sign that flipped a finding"
fix = "Check units and signs against the data documentation."
body = "Capital spending was stored as negative numbers, following cash-flow convention. Used as it was, it reversed a conclusion."

[[sections.folds]]
title = "A build that said it worked"
fix = "Open the output file and check it, whatever the log says."
body = "The script that turns a manuscript into a Word file skipped formatting rules that did not match and still reported success. The headings came out in the wrong font."

[[sections.folds]]
title = "An agent that kept running"
fix = "Give agents narrow folder paths, and clear leftover processes after long jobs."
body = "A file search started by an AI helper kept going after its task had ended. For almost three hours it ran at high CPU and swamped the cloud-sync service, which tried to download every file the search touched."

[[sections]]
id = "tools"
nav = "Tools and limits"
title = "Tools and limits"

[[sections.cards]]
title = "Tools"
points = [
  "Claude Code is my main tool. Each project has a rules file and a memory that syncs across my devices; a few custom skills handle recurring research tasks, and connected tools search the literature and check citations.",
  "I have tried OpenAI's Codex on side tasks, for comparison.",
  "In measurement work, one model labels the text and a second model checks the labels.",
]

[[sections.cards]]
title = "Where I draw the line"
points = [
  "The research question and the design are mine, and so is every claim in print.",
  "I check every reference against its DOI before it goes into a paper.",
  "Public code runs on simulated or public data. Confidential research data stays out of public repositories.",
  "I declare AI use as each journal requires.",
]
