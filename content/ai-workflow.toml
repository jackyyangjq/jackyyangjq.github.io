[[sections]]
id = "research"
nav = "A research paper"
title = "A paper from question to submission"
lead = "A working paper on generative AI and tourism jobs. Claude Code worked on every stage and I kept the decisions. Results and data details stay off this page until the paper is published."
timeline_labels = ["AI", "Me"]
callout = "The AI shock arrived while in-person services were still recovering from the pandemic. Comparing tourism with other service industries keeps the two apart."

[[sections.timeline]]
stage = "Question and literature"
ai = "Searches the literature, summarises papers and checks whether a term I plan to use already means something else in the field."
me = "The question and what the paper adds."

[[sections.timeline]]
stage = "Design"
ai = "Drafts alternative designs and lists the threats to each."
me = "The identification strategy."

[[sections.timeline]]
stage = "Data and code"
ai = "Writes the scripts and re-estimates the main results a second, independent way."
me = "Definitions, the sample, and what a result must survive before I trust it."

[[sections.timeline]]
stage = "Writing"
ai = "Drafts sections from my outline, following a style guide and a fixed glossary."
me = "The argument and every claim."

[[sections.timeline]]
stage = "Revision"
ai = "Turns supervisor comments into task cards; a fresh session audits each change."
me = "Which comments to act on, and how."

[[sections.timeline]]
stage = "Submission"
ai = "Builds the journal's Word files and traces every number back to a script."
me = "The final read and the AI-use statement."

[[sections]]
id = "effort"
nav = "Effort levels"
title = "Matching effort to the task"
lead = "With Claude Opus 5.5, Claude Code lets me set how hard the model thinks and checks before it answers. I switch it several times on one task: low while we work out what to do, high when the result needs checking. More effort catches edge cases; it does not fix a wrong approach."
steps_style = "pills"
level_labels = ["In research", "In web coding"]
default_level = 1
note = "Adapted for research and web work from Thariq Shihipar, [“Using Claude Code: Spending your effort”](https://claude.dev/blog/spending-your-effort/) (September 2026)."

