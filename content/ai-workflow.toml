[[sections]]
id = "vibe-coding"
nav = "Vibe coding"
title = "Vibe coding"
lead = "Describing software in plain language and letting an AI coding agent write the code. I decide what gets built and how to check it."
examples_title = "Built this way"

[[sections.tiles]]
icon = "messages"
title = "Spec first"
body = "The agent interviews me before any code, and my answers become the spec."

[[sections.tiles]]
icon = "eye"
title = "Check every step"
body = "After each change I run the app or the numbers, rather than trusting code that reads well."

[[sections.tiles]]
icon = "target"
title = "Known answers"
body = "Methods are tested on simulated data with a known effect, and LLM labels against a second model."

[[sections.tiles]]
icon = "key"
title = "Secrets stay local"
body = "API keys stay out of git, and I read every public repository before it goes out."

