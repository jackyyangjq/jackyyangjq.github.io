[[groups.items]]
title = "Statistics and econometrics toolkit"
subtitle = "Python · simulated data with known answers"
content = "Statistics and econometrics I use in research, each checked on simulated data: staggered DiD, quantile regression with fixed effects, VAR, bounded-outcome models, change points."
