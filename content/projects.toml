[[groups.items]]
title = "Measuring text with an LLM"
subtitle = "Python · 998 public hotel reviews"
content = "LLM labelling of 998 hotel reviews, validated six ways: 94.6% agreement with the guests' own liked/disliked split, alpha 0.93 against a second model, no false labels on controls."
image = "/images/projects/llm-validation.webp"
image_alt = "Agreement of LLM labels with a repeat run, a second model and cheaper baselines, by review aspect"
tags = ["LLM", "Text as data", "Reliability"]
[[groups.items.links]]
label = "Code"
href = "https://github.com/jackieyangjq/llm-text-measurement"

[[groups.items]]
title = "Machine-learning inflation forecasts"
subtitle = "Python · replication of Medeiros et al. (2021)"
content = "Machine-learning forecasts of US inflation from 121 FRED-MD series. Tree models cut forecast error by 15–20% against an AR benchmark in 2001–2015, but not since 2020."
image = "/images/projects/inflation-forecasts.webp"
image_alt = "US inflation over the next 12 months: realised values against random-forest and AR forecasts"
tags = ["Forecasting", "Machine learning", "Replication"]
[[groups.items.links]]
label = "Code"
href = "https://github.com/jackieyangjq/ml-inflation-forecasting"

