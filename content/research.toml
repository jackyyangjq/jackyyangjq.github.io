title = "Disclosed digital strategy in tourism: The automation–augmentation paradox in experiential service firms"
status = "Working paper"
authorship = "**Yang, J.**, Hao, F.†, & Wang, K."
award = "Overall Best Paper Award and Hospitality Management Best Paper Award, CHME 2026 (conference version)"
summary = "How tourism and hospitality firms present automation and augmentation strategies in their disclosures, measured with LLM labels that must quote their evidence."
