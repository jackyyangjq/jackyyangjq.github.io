[[groups.items]]
title = "Digital transformation and performance in the hotel industry"
status = "PhD thesis · in preparation"
summary = "Two studies on how self-service check-in technology changes hotel operations and the guest experience, using large-scale operational data and online reviews."
methods = ["Multilevel variance decomposition", "Quantile regression with fixed effects", "Staggered DiD for count outcomes", "LLM measurement of review text"]

