type = "research"
title = "Research"
description = "I study how digital technology and public policy change tourism and hospitality markets, using causal inference, time-series models and large language models as measurement tools for text."
methods_title = "Methods and tools"
methods_description = "Each area links to open code that runs the methods on simulated or public data, so the implementation can be checked without the confidential research data."
note = "† Corresponding author. Papers under review are shown without estimates or original figures, to respect the review process; the sketches show each research design, not results."

[[groups]]
id = "working-papers"
title = "Under review"

[[groups.items]]
title = "Beyond tourism boom: Demand-side tourism promotion policies and housing prices"
status = "Major revision"
venue = "Annals of Tourism Research"
authorship = "Wang, J., Hao, F., **Yang, J.**†, & Song, H."
summary = "A visa liberalisation policy rolled out region by region in an East Asian country, studied with transaction-level housing data."
finding = "Housing prices rose where the policy applied; the effect appeared only after a few years and worked partly through exposure to tourist flows."
figure = "/images/research/staggered-policy.svg"
figure_alt = "Design sketch: regions adopt the policy in waves, and the estimated effect rises only after a lag. Not real estimates."
figure_caption = "Design sketch, not estimates."
methods = ["Staggered difference-in-differences", "Event study", "Sun–Abraham estimator", "Spatial (Conley) standard errors", "Placebo and randomisation tests"]
[[groups.items.links]]
label = "Methods code, simulated data"
href = "https://github.com/jackieyangjq/applied-stats-econometrics-toolkit"

[[groups.items]]
title = "Destination sentiment climate and tourist demand: LLM-based aspect sentiment, avoidance signals, and time-series evidence"
status = "Major revision, round 2"
venue = "Journal of Travel Research"
authorship = "Hao, F., Wang, K., **Yang, J.**, & Qiu, X."
summary = "Daily indicators built from social-media posts about a destination in an Asian city, linked to official visitor arrivals."
finding = "Shifts in online sentiment came before changes in how often people said they would avoid the destination, and those came before changes in arrivals."
figure = "/images/research/sentiment-lead.svg"
figure_alt = "Design sketch: three daily series in which sentiment moves first, avoidance talk next and arrivals last. Not real data."
figure_caption = "Design sketch, not estimates."
methods = ["LLM aspect-based sentiment", "Reliability checks", "Unit-root tests", "VAR and Granger causality", "Impulse responses"]
[[groups.items.links]]
label = "Text-measurement code"
href = "https://github.com/jackieyangjq/llm-text-measurement"

[[groups.items]]
title = "The green push: How does China's carbon-emissions trading drive corporate green transformation?"
status = "Revise & resubmit"
venue = "Journal of Cleaner Production"
authorship = "**Yang, J.**, Lai, L.†, Hsu, S.-C., & Wei, H.-H."
summary = "China's emissions-trading pilots, introduced in waves across regions, studied with a panel of listed firms and a new index of green transformation built partly from the text of annual reports."
figure = "/images/research/green-index-design.svg"
figure_alt = "Design sketch: annual-report text feeds a firm-level green index, and pilots that start in waves are compared with a staggered difference-in-differences design."
figure_caption = "Design sketch."
methods = ["Staggered DiD (Callaway–Sant'Anna)", "Goodman-Bacon decomposition", "Dictionary expanded with word embeddings", "CRITIC and entropy weighting", "Bootstrapped mediation"]

