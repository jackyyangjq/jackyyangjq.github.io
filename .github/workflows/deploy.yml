name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Once a day: refresh the visitor statistics shown on the site
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public share link of the analytics dashboard (set as a repository variable)
      UMAMI_SHARE_URL: ${{ vars.UMAMI_SHARE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh visitor statistics
        if: env.UMAMI_SHARE_URL != ''
        # A failed fetch keeps the last committed statistics instead of breaking the deploy
        continue-on-error: true
        run: node scripts/fetch-visitors.mjs

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
