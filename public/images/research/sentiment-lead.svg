  <title id="t">Design sketch: which daily series moves first</title>
  <desc id="d">Top: social-media posts are labelled by a large language model and turned into daily series. Below: three illustrative daily series on one time axis. Online sentiment dips first, talk of avoiding the destination rises next, and visitor arrivals dip last; arrows show the order. Not real data.</desc>
