<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="t d">
  <title id="t">Design sketch: a policy rolled out region by region, and a lagged effect on house prices</title>
  <desc id="d">Left: a hexagon map of regions shaded by the wave in which the policy reached them; some regions are never covered. Right: an illustrative event study in which the effect on house prices stays near zero before the policy and at first after it, then rises after a lag. Not real estimates.</desc>
